<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa — 5a Galeria</title><meta name="description" content="Mapa público de obras actuales y desaparecidas del Archivo 5a Galeria."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo-5a.png" alt="5a Galeria"></a><nav><a href="index.html">Inicio</a><a href="archivo.html">Archivo</a><a href="mapa.html">Mapa</a><a href="https://tally.so/r/qDoB1P" class="nav-submit">Avistar</a></nav></header>
<main class="section"><div class="section-head"><div><p class="section-kicker">03 / MAPA</p><h1>LA CIUDAD ES<br>LA GALERÍA.</h1></div><p id="map-status">CARGANDO CARTOGRAFÍA…</p></div><div id="map" style="height:70vh;min-height:480px;border:2px solid var(--ink)"></div><p class="archive-note">Sólo se muestran expedientes públicos que contienen coordenadas. Las obras desaparecidas pueden permanecer cartografiadas como memoria.</p></main><footer><div>5a GALERIA</div><div>La5agaleria@proton.me</div><div>© Archivo 5a Galeria</div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([41.3874,2.1686],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
(async()=>{const st=document.getElementById('map-status');try{const r=await fetch('data/archivo.json',{cache:'no-store'});const d=await r.json();const rows=(d.records||[]).filter(x=>x.publicado!==false&&x.coordenadas);let n=0;rows.forEach(x=>{const p=String(x.coordenadas).split(',').map(Number);if(p.length!==2||p.some(Number.isNaN))return;n++;const title=x.titulo||x.tecnica||'INTERVENCIÓN URBANA';L.marker(p).addTo(map).bindPopup(`<strong>${esc(x.expediente||'EXPEDIENTE')}</strong><br>${esc(title)}<br>${esc(x.estado||'')}${x.expediente?`<br><a href="expediente.html?id=${encodeURIComponent(x.expediente)}">Abrir expediente</a>`:''}`)});st.textContent=n?`${n} EXPEDIENTE${n===1?'':'S'} CARTOGRAFIADO${n===1?'':'S'}`:'MAPA PÚBLICO: AÚN SIN COORDENADAS.';}catch(e){st.textContent='ERROR DE LECTURA CARTOGRÁFICA.';}})();</script></body></html>
