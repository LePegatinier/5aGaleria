<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa — 5a Galeria</title><meta name="description" content="Mapa público de obras actuales y desaparecidas del Archivo 5a Galeria."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo-5a.png" alt="5a Galeria"></a><nav><a href="index.html">Inicio</a><a href="archivo.html">Archivo</a><a href="mapa.html">Mapa</a><a href="index.html#stratascore">StrataScore™</a><a class="nav-submit" href="https://tally.so/r/qDoB1P">Avistar</a></nav></header>
<main class="section"><div class="section-head"><div><p class="section-kicker">03 / MAPA</p><h1>LA CIUDAD ES<br>LA GALERÍA.</h1></div><p id="map-status">CARGANDO CARTOGRAFÍA…</p></div>
<section class="map-tools" aria-label="Filtros del mapa"><label>BUSCAR<input id="map-search" type="search" placeholder="Expediente, artista, ciudad…" autocomplete="off"></label><label>CIUDAD<select id="map-city"><option value="">Todas</option></select></label><label>TÉCNICA<select id="map-technique"><option value="">Todas</option></select></label><label>ESTADO<select id="map-state"><option value="">Todos</option></select></label><button id="map-reset" type="button">LIMPIAR</button></section>
<div id="map" style="height:70vh;min-height:480px;border:2px solid var(--ink)"></div><p class="archive-note">Sólo se muestran expedientes públicos con coordenadas válidas. Las obras desaparecidas pueden permanecer cartografiadas como memoria.</p></main>
<footer><div>5a GALERIA</div><div>La5agaleria@proton.me</div><div>© Archivo 5a Galeria</div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([41.3874,2.1686],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();let rows=[],markers=[];
function fill(id,field){const el=document.getElementById(id);[...new Set(rows.map(x=>String(x[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>el.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));}
function draw(){markers.forEach(m=>m.remove());markers=[];const q=norm(document.getElementById('map-search').value),city=document.getElementById('map-city').value,tech=document.getElementById('map-technique').value,state=document.getElementById('map-state').value;const filtered=rows.filter(x=>{const hay=norm([x.expediente,x.titulo,x.artista,x.ciudad,x.ubicacion,x.tecnica,x.estado,x.stratascore].join(' '));return(!q||hay.includes(q))&&(!city||x.ciudad===city)&&(!tech||x.tecnica===tech)&&(!state||x.estado===state)});filtered.forEach(x=>{const p=String(x.coordenadas).split(',').map(Number);if(p.length!==2||p.some(n=>!Number.isFinite(n)))return;const href=`expediente.html?id=${encodeURIComponent(x.expediente)}`,title=x.titulo||x.expediente;const img=x.imagen?`<img src="${esc(x.imagen)}" alt="" style="width:110px;height:110px;object-fit:cover;display:block;margin-top:8px">`:'';const popup=`<div style="min-width:190px"><strong>${esc(x.expediente)}</strong><br><b>${esc(title)}</b><br>${esc(x.artista||'ANÓNIMO')}<br>${esc(x.ciudad||'')} · ${esc(x.tecnica||'')}<br>${esc(x.estado||'')} ${x.stratascore?`· ${esc(x.stratascore)}`:''}${img}<br><a href="${href}">ABRIR EXPEDIENTE →</a></div>`;const marker=L.marker(p).addTo(map).bindPopup(popup);markers.push(marker)});document.getElementById('map-status').textContent=`${filtered.length} EXPEDIENTE${filtered.length===1?'':'S'} CARTOGRAFIADO${filtered.length===1?'':'S'}`;if(filtered.length===1){const p=String(filtered[0].coordenadas).split(',').map(Number);map.setView(p,16)}else if(!filtered.length){document.getElementById('map-status').textContent='NINGÚN EXPEDIENTE COINCIDE.'}}
(async()=>{try{const r=await fetch('data/archivo.json',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();rows=(d.records||[]).filter(x=>x.publicado===true&&/^5a-\d{6}$/.test(String(x.expediente||''))&&/^\s*-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?\s*$/.test(String(x.coordenadas||'')));fill('map-city','ciudad');fill('map-technique','tecnica');fill('map-state','estado');['map-search','map-city','map-technique','map-state'].forEach(id=>document.getElementById(id).addEventListener(id==='map-search'?'input':'change',draw));document.getElementById('map-reset').addEventListener('click',()=>{document.getElementById('map-search').value='';['map-city','map-technique','map-state'].forEach(id=>document.getElementById(id).value='');draw()});draw();}catch(e){document.getElementById('map-status').textContent='ERROR DE LECTURA CARTOGRÁFICA.';}})();
</script></body></html>
