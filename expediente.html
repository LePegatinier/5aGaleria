<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expediente 5a Galeria</title><meta name="description" content="Expediente del Archivo Público de la 5a Galeria."><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo-5a.png" alt="5a Galeria"></a><nav><a href="index.html">Inicio</a><a href="archivo.html">Archivo</a><a href="mapa.html">Mapa</a><a href="index.html#stratascore">StrataScore™</a><a class="nav-submit" href="https://tally.so/r/qDoB1P">Avistar</a></nav></header>
<main class="section" id="expediente"><p class="section-kicker">ARCHIVO PÚBLICO / EXPEDIENTE</p><div id="content"><p>CARGANDO EXPEDIENTE…</p></div></main>
<footer><div>5a GALERIA</div><div>La5agaleria@proton.me</div><div>© Archivo 5a Galeria</div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const validId=id=>/^5a-\d{6}$/.test(String(id||''));
const scoreLabels=['Origen','Mediación','Soporte','Autonomía','Artwash'];
function field(label,value,extra=''){return `<div class="record-field"><span>${label}</span><strong>${value||'—'}</strong>${extra}</div>`}
function scoreBlock(x){
  const vals=scoreLabels.map(k=>Number(x[`strata_${k.toLowerCase()}`]));
  const has=vals.every(v=>Number.isFinite(v)&&v>=0&&v<=4)&&Number.isFinite(Number(x.strata_index));
  if(!has)return `<section class="record-section"><p class="section-kicker">STRATASCORE™</p><h2>EVALUACIÓN PENDIENTE.</h2><p>No hay una matriz completa de evidencias. La 5a Galeria no inventa puntuaciones para rellenar una casilla.</p></section>`;
  return `<section class="record-section"><p class="section-kicker">STRATASCORE™ / MATRIZ</p><div class="record-grid strata-grid">${scoreLabels.map((k,i)=>field(k.toUpperCase(),String(vals[i])+` / 4`)).join('')}${field('ÍNDICE',`${esc(x.strata_index)} / 20`)}${field('CERTIFICACIÓN',esc(x.stratascore))}</div><p>${esc(x.strata_evidence||'Sin evidencia pública añadida.')}</p><small>El índice suma cinco variables de 0–4. No evalúa calidad artística.</small></section>`;
}
async function load(){const el=document.getElementById('content'),id=new URLSearchParams(location.search).get('id');if(!validId(id)){el.innerHTML='<div class="archive-empty"><h1>EXPEDIENTE NO ESPECIFICADO.</h1><p><a href="archivo.html">Volver al archivo.</a></p></div>';return;}try{const r=await fetch('data/archivo.json',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();const x=(d.records||[]).find(v=>v.expediente===id&&v.publicado===true&&/^\s*-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?\s*$/.test(String(v.coordenadas||'')));if(!x){el.innerHTML='<div class="archive-empty"><h1>EXPEDIENTE NO DISPONIBLE.</h1><p>El registro puede estar en revisión o fuera del archivo público.</p><p><a href="archivo.html">Volver al archivo.</a></p></div>';return;}const title=x.titulo||x.tecnica||'INTERVENCIÓN URBANA',img=x.imagen?`<img class="record-image" src="${esc(x.imagen)}" alt="${esc(title)}">`:'';const maps=`https://www.openstreetmap.org/?mlat=${encodeURIComponent(String(x.coordenadas).split(',')[0].trim())}&mlon=${encodeURIComponent(String(x.coordenadas).split(',')[1].trim())}#map=18`;el.innerHTML=`<div class="record-header"><div><p class="section-kicker">5a GALERIA / ${esc(x.expediente)}</p><h1>${esc(title)}</h1></div><div class="record-stamp">EXPEDIENTE<br>${esc(x.expediente)}</div></div><div class="record-image-wrap">${img||'<div class="fake-photo photo-b"><span>DOCUMENTO<br>DE CALLE</span></div>'}</div><div class="record-grid">${field('ARTISTA / ALIAS',esc(x.artista||'ANÓNIMO'))}${field('CIUDAD',esc(x.ciudad||'NO ESPECIFICADA'))}${field('UBICACIÓN',esc(x.ubicacion||'NO ESPECIFICADA'))}${field('FECHA DE AVISTAMIENTO',esc(x.fecha||'NO REGISTRADA'))}${field('TÉCNICA',esc(x.tecnica||'DESCONOCIDA'))}${field('ESTADO DE LA OBRA',esc(x.estado||'DESCONOCIDO'))}${field('STRATASCORE™',esc(x.stratascore||'PENDIENTE'))}${field('ÍNDICE STRATASCORE',Number.isFinite(Number(x.strata_index))?`${esc(x.strata_index)} / 20`:'—')}${field('COORDENADAS',esc(x.coordenadas),`<a class="field-link" target="_blank" rel="noopener" href="${maps}">ABRIR CARTOGRAFÍA →</a>`)}</div>${scoreBlock(x)}<section class="record-section"><p class="section-kicker">NOTA DOCUMENTAL</p><h2>LA OBRA DEJA<br>UN RASTRO.</h2><p>${esc(x.observaciones||'Sin observaciones públicas. El expediente queda abierto a futuras actualizaciones documentales.')}</p></section><section class="record-section"><p class="section-kicker">HISTORIAL</p><div class="timeline"><div><b>REGISTRO ACTUAL</b><span>${esc(x.fecha||'Fecha no registrada')}</span><p>Estado archivado: ${esc(x.estado||'desconocido')}.</p></div><div><b>PRÓXIMOS AVISTAMIENTOS</b><span>PREPARADO</span><p>La estructura del expediente queda preparada para incorporar nuevas observaciones de la misma obra sin crear un expediente paralelo.</p></div></div></section><div class="record-actions"><a class="button button-dark" href="archivo.html">← ARCHIVO</a><a class="button" href="mapa.html">VER MAPA</a></div>`;}catch(e){el.innerHTML='<div class="archive-empty"><h1>ERROR DE LECTURA.</h1><p>No se pudo cargar el expediente público.</p></div>';}}load();
</script></body></html>
