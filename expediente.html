<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expediente 5a Galeria</title><meta name="description" content="Expediente del Archivo Público de la 5a Galeria."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="header.css?v=5"><style>
.record-identity{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:24px;margin:20px 0 40px}.record-meta{border:2px solid var(--ink);padding:22px;background:#f5f1e9}.record-meta h3{margin:0 0 14px;font-size:12px;text-transform:uppercase}.record-meta p{margin:8px 0;font-size:12px}.record-grid{margin-top:25px}.record-section{margin-top:48px}.record-section>h2{margin-bottom:14px}.strata-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:2px solid var(--ink)}.strata-grid .record-field{min-height:105px;border-right:1px solid var(--ink);padding:16px}.strata-grid .record-field:nth-child(5){border-right:0}.strata-grid .record-field:nth-child(n+6){border-top:2px solid var(--ink);border-right:1px solid var(--ink)}.strata-grid .record-field:nth-child(7){border-right:0}.strata-grid .record-field:nth-child(6){grid-column:1 / span 3}.strata-grid .record-field:nth-child(7){grid-column:4 / span 2}.score-contributions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}.score-contribution{border:1px solid var(--ink);padding:12px}.score-contribution strong{display:block;font-size:11px}.score-contribution span{display:block;font:700 22px/1 'IBM Plex Mono',monospace;margin-top:8px}.evidence-box{border-left:4px solid var(--ink);padding:16px 20px;background:#f5f1e9;margin-top:22px}.evidence-box strong{display:block;font-size:11px;text-transform:uppercase;margin-bottom:8px}.record-status{display:inline-block;border:2px solid var(--ink);padding:7px 10px;font:700 10px 'IBM Plex Mono',monospace;text-transform:uppercase}.record-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.record-tags small{border:1px solid var(--ink);padding:5px 8px;font:10px 'IBM Plex Mono',monospace}.record-identity .record-stamp{align-self:start}.revision-note{font-size:10px;line-height:1.6;color:var(--muted);margin-top:18px}@media(max-width:800px){.record-identity{grid-template-columns:1fr}.strata-grid{grid-template-columns:1fr 1fr}.strata-grid .record-field,.strata-grid .record-field:nth-child(n){grid-column:auto;border-right:1px solid var(--ink)}.strata-grid .record-field:last-child{border-right:0}.score-contributions{grid-template-columns:1fr 1fr}}
 .verified-strata{display:flex;align-items:center;gap:20px;border:2px solid var(--ink);padding:16px;margin-top:20px;background:#f5f1e9}.verified-strata img{width:140px;max-width:30%;height:auto;display:block}.verified-strata strong{font-size:11px;text-transform:uppercase}.verified-strata h2{margin:6px 0 0;font-size:20px}@media(max-width:600px){.verified-strata{align-items:flex-start}.verified-strata img{width:110px}} </style></head><body><header class="site-header"><div class="site-identity"><a class="brand" href="index.html" aria-label="5a Galeria"><img src="assets/logo-5a.png" alt="5a Galeria"></a><div class="powered-by" aria-label="5a Galeria · Powered by Agents Incívics · LPGTNR_LAB"><img src="assets/banner-5a-galeria-correcta.svg" alt="5a Galeria · Powered by Agents Incívics · LPGTNR_LAB"></div></div><nav><a href="index.html" data-nav="inicio">Inicio</a><a href="https://tally.so/r/gDoB1P" target="_blank" rel="noopener noreferrer" data-nav="avistar">Avistar</a><a href="archivo.html" data-nav="archivo">Archivo</a><a href="mapa.html" data-nav="mapa">Mapa</a><a href="calabozo.html" data-nav="calabozo">Calabozo</a><a href="stratascore.html" data-nav="stratascore">StrataScore™</a><a href="premis.html" data-nav="premis">Premis</a><a href="loreverso.html" data-nav="lab">Pegatinier Lab</a><a href="street-raw.html" data-nav="ondemand">On demand</a></nav></header><script>(function(){const p=location.pathname.split('/').pop()||'index.html';const map={'index.html':'inicio','archivo.html':'archivo','calabozo.html':'calabozo','mapa.html':'mapa','stratascore.html':'stratascore','premis.html':'premis','loreverso.html':'lab','street-raw.html':'ondemand'};const k=map[p];if(k){const a=document.querySelector('.site-header nav a[data-nav="'+k+'"]');if(a){a.classList.add('active');a.setAttribute('aria-current','page')}}})();</script><main class="section" id="expediente"><p class="section-kicker">ARCHIVO PÚBLICO / EXPEDIENTE</p><div id="content"><p>CARGANDO EXPEDIENTE…</p></div></main><footer><div>5a GALERIA</div><div>La5agaleria@proton.me</div><div>© Archivo 5a Galeria</div></footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const validId=id=>/^5a-\d{6}$/.test(String(id||''));
const scoreLabels=['Origen','Mediación','Soporte','Autonomía','Artwash'];
const scoreDescriptions={
'Origen':'Autonomía del nacimiento de la intervención.',
'Mediación':'Intervención institucional, comercial o de marca.',
'Soporte':'Dependencia real del espacio público como soporte.',
'Autonomía':'Capacidad de existir fuera del marco que la legitima.',
'Artwash':'Uso de la estética callejera como imagen urbana, marca, turismo o transformación.'
};
function field(label,value,extra=''){return `<div class="record-field"><span>${label}</span><strong>${value||'—'}</strong>${extra}</div>`}
function strataGrade(x){
 const s=String(x.stratascore_validado||x.stratascore||'').trim();
 const m=s.match(/^([A-E])(?:\s|$)/i);
 if(m)return m[1].toUpperCase();
 const n=Number(x.strata_index_validado??x.strata_index);
 if(Number.isFinite(n)&&n>=0&&n<=20)return n<=3?'A':n<=7?'B':n<=11?'C':n<=15?'D':'E';
 return '';
}
function strataImage(x){const g=String(x.stratascore_validado||x.stratascore||'').trim().match(/^([A-E])(?:\s|$)/i)?.[1]?.toUpperCase()||'';if(!g)return '';if(String(x.expediente||'')==='5a-000009')return 'assets/5a-000009-C.svg?v=20260923-EXP9C-FINAL';return 'assets/'+g+'.png?v=20260923-'+g;}
function scoreBlock(x){
 const vals=scoreLabels.map(k=>Number(x[`strata_${k.toLowerCase()}`]));
 const contributions=Array.isArray(x.strata_contribucion)?x.strata_contribucion:[];
 const has=vals.every(v=>Number.isFinite(v)&&v>=0&&v<=4)&&Number.isFinite(Number(x.strata_index));
 const grade=strataGrade(x),image=strataImage(x);
 if(!has){
   if(grade)return `<section class="record-section"><p class="section-kicker">STRATASCORE™ / CERTIFICACIÓN</p><div class="verified-strata"><img src="${image}" alt="StrataScore™ ${esc(grade)}"><div><h2>${esc(grade)} — ${esc(x.stratascore_validado||x.stratascore||'CERTIFICADO')}</h2><p>Clasificación verificada para este expediente.</p></div></div></section>`;
   return `<section class="record-section"><p class="section-kicker">STRATASCORE™</p><h2>EVALUACIÓN PENDIENTE.</h2><p>No hay una matriz completa de evidencias. La 5a Galeria no inventa puntuaciones para rellenar una casilla.</p></section>`;
 }
 return `<section class="record-section"><p class="section-kicker">STRATASCORE™ / MATRIZ CERTIFICADA</p><div class="record-grid strata-grid">${scoreLabels.map((k,i)=>field(k.toUpperCase(),String(vals[i])+' / 4')).join('')}${field('ÍNDICE',`${esc(x.strata_index)} / 20`)}${field('CERTIFICACIÓN',esc(x.stratascore))}</div>${image?`<div class="verified-strata"><img src="${image}" alt="StrataScore™ ${esc(grade)}"><div><strong>STRATASCORE™ VERIFICADO</strong><h2>${esc(grade)} — ${esc(x.stratascore_validado||x.stratascore)}</h2></div></div>`:''}<div class="score-contributions">${scoreLabels.map((k,i)=>`<div class="score-contribution"><strong>${k.toUpperCase()}</strong><small>${esc(scoreDescriptions[k])}</small><span>${Number.isFinite(Number(contributions[i]))?esc(contributions[i]):'—'} pts</span></div>`).join('')}</div><div class="evidence-box"><strong>EVIDENCIA DOCUMENTAL</strong><p>${esc(x.strata_evidence||'Sin evidencia pública añadida.')}</p></div><p class="revision-note">El índice suma cinco variables de 0–4 según la matriz StrataScore™. No evalúa calidad artística. La certificación puede revisarse si aparecen nuevas evidencias.</p></section>`;
}
async function load(){
 const el=document.getElementById('content'),id=new URLSearchParams(location.search).get('id');
 if(!validId(id)){el.innerHTML='<div class="archive-empty"><h1>EXPEDIENTE NO ESPECIFICADO.</h1><p><a href="archivo.html">Volver al archivo.</a></p></div>';return}
 try{
  const r=await fetch('data/archivo.json',{cache:'no-store'});if(!r.ok)throw new Error();
  const d=await r.json(),x=(d.records||[]).find(v=>v.expediente===id&&v.publicado===true&&/^-?\d+(?:\.\d+)?,\s*-?\d+(?:\.\d+)?$/.test(String(v.coordenadas||'')));
  if(!x){el.innerHTML='<div class="archive-empty"><h1>EXPEDIENTE NO DISPONIBLE.</h1><p>El registro puede estar en revisión o fuera del archivo público.</p><p><a href="archivo.html">Volver al archivo.</a></p></div>';return}
  const title=x.titulo||x.tecnica||'INTERVENCIÓN URBANA',img=x.imagen?`<img class="record-image" src="${esc(x.imagen)}" alt="${esc(title)}">`:'';
  const maps=`https://www.openstreetmap.org/?mlat=${encodeURIComponent(String(x.coordenadas).split(',')[0].trim())}&mlon=${encodeURIComponent(String(x.coordenadas).split(',')[1].trim())}#map=18`;
  const status=esc(x.estado||'DESCONOCIDO');
  el.innerHTML=`<div class="record-header"><div><p class="section-kicker">5a GALERIA / ${esc(x.expediente)}</p><h1>${esc(title)}</h1><p class="record-status">${status}</p></div><div class="record-stamp">EXPEDIENTE<br>${esc(x.expediente)}</div></div>
  <div class="record-image-wrap">${img||'<div class="fake-photo photo-b"><span>DOCUMENTO<br>DE CALLE</span></div>'}</div>
  <section class="record-identity"><div class="record-grid"><div class="record-grid">${field('ARTISTA / ALIAS',esc(x.artista||'ANÓNIMO'))}${field('CIUDAD',esc(x.ciudad||'NO ESPECIFICADA'))}${field('UBICACIÓN',esc(x.ubicacion||'NO ESPECIFICADA'))}${field('FECHA DE AVISTAMIENTO',esc(x.fecha||'NO REGISTRADA'))}${field('TÉCNICA',esc(x.tecnica||'DESCONOCIDA'))}${field('TIPO / FORMATO',esc(x.tipo_formato||x.tecnica||'DESCONOCIDO'))}</div></div><div class="record-meta"><h3>TRAZABILIDAD</h3><p><strong>EXPEDIENTE:</strong> ${esc(x.expediente)}</p><p><strong>ESTADO:</strong> ${status}</p><p><strong>PUBLICACIÓN:</strong> REGISTRO PÚBLICO</p><p><strong>REVISIÓN:</strong> ${esc(x.strata_fecha_revision||'No registrada')}</p><a class="field-link" target="_blank" rel="noopener" href="${maps}">ABRIR CARTOGRAFÍA →</a></div></section>
  ${scoreBlock(x)}
  <section class="record-section advisory-section"><p class="section-kicker">METHACRYLATE ADVISORY™</p><h2>${x.methacrylate_advisory?'AVISO ACTIVO.':'SIN AVISO ACTIVO.'}</h2><p>${x.methacrylate_advisory?'Se ha detectado una posible deriva de domesticación. El expediente puede estar destinado al Calabozo del Metacrilato™.':'Este expediente no presenta actualmente un METHACRYLATE ADVISORY™.'}</p>${x.motivos_reclusion?.length?`<div class="record-tags">${x.motivos_reclusion.map(v=>`<small>${esc(v)}</small>`).join('')}</div>`:''}</section>
  <section class="record-section"><p class="section-kicker">NOTA DOCUMENTAL</p><h2>LA OBRA DEJA<br>UN RASTRO.</h2><p>${esc(x.observaciones||'Sin observaciones públicas. El expediente queda abierto a futuras actualizaciones documentales.')}</p></section>
  <section class="record-section"><p class="section-kicker">HISTORIAL</p><div class="timeline"><div><b>REGISTRO ACTUAL</b><span>${esc(x.fecha||'Fecha no registrada')}</span><p>Estado archivado: ${status}.</p></div><div><b>REVISIÓN</b><span>STRATASCORE™</span><p>La clasificación queda vinculada a la evidencia disponible y puede actualizarse cuando cambie la relación de la obra con la calle.</p></div></div></section>
  <div class="record-actions"><a class="button button-dark" href="archivo.html">← ARCHIVO</a><a class="button" href="mapa.html">VER MAPA</a></div>`
 }catch(e){el.innerHTML='<div class="archive-empty"><h1>ERROR DE LECTURA.</h1><p>No se pudo cargar el expediente público.</p></div>'}
}
load();</script></body></html>
