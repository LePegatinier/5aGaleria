<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expediente 5a Galeria</title>
<meta name="description" content="Expediente del Archivo Público de la 5a Galeria.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><img src="assets/logo-5a.png" alt="5a Galeria"></a><nav><a href="index.html">Inicio</a><a href="archivo.html">Archivo</a><a href="mapa.html">Mapa</a><a class="nav-submit" href="https://tally.so/r/qDoB1P">Avistar</a></nav></header>
<main class="section" id="expediente"><p class="section-kicker">ARCHIVO PÚBLICO / EXPEDIENTE</p><div id="content"><p>CARGANDO EXPEDIENTE…</p></div></main>
<footer><div>5a GALERIA</div><div>La5agaleria@proton.me</div><div>© Archivo 5a Galeria</div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const el=document.getElementById('content');const id=new URLSearchParams(location.search).get('id');if(!id){el.innerHTML='<h1>EXPEDIENTE NO ESPECIFICADO.</h1><p><a href="archivo.html">Volver al archivo.</a></p>';return;}try{const r=await fetch('data/archivo.json',{cache:'no-store'});const d=await r.json();const x=(d.records||[]).find(v=>(v.expediente||v.numero)===id&&v.publicado!==false);if(!x){el.innerHTML='<h1>EXPEDIENTE NO DISPONIBLE.</h1><p>El registro puede estar todavía en revisión o no formar parte del archivo público.</p><p><a href="archivo.html">Volver al archivo.</a></p>';return;}const title=x.titulo||x.tecnica||'INTERVENCIÓN URBANA';const img=x.imagen?`<img src="${esc(x.imagen)}" alt="${esc(title)}" style="width:100%;max-height:720px;object-fit:contain;background:#171515">`:'';el.innerHTML=`<div class="section-head"><div><p class="section-kicker">5a GALERIA / ${esc(x.expediente||x.numero)}</p><h1>${esc(title)}</h1></div><p>${esc(x.ciudad||'')}${x.fecha?' · '+esc(x.fecha):''}</p></div><div style="border:2px solid var(--ink);padding:10px;background:#f5f1e9">${img||'<div class="fake-photo photo-b"><span>DOCUMENTO<br>DE CALLE</span></div>'}</div><div class="manifesto-grid" style="margin-top:35px"><div><p><strong>ARTISTA / ALIAS</strong><br>${esc(x.artista||'ANÓNIMO')}</p><p><strong>UBICACIÓN</strong><br>${esc(x.ubicacion||'NO ESPECIFICADA')}</p><p><strong>TÉCNICA</strong><br>${esc(x.tecnica||'DESCONOCIDA')}</p></div><div><p><strong>ESTADO</strong><br>${esc(x.estado||'DESCONOCIDO')}</p><p><strong>STRATASCORE™</strong><br>${esc(x.stratascore||'PENDIENTE')}</p><p><strong>DOCUMENTACIÓN</strong><br>${esc(x.observaciones||'Sin observaciones públicas.')}</p></div></div><p style="margin-top:40px"><a class="button button-dark" href="archivo.html">← Volver al archivo</a></p>`;}catch(e){el.innerHTML='<h1>ERROR DE LECTURA.</h1><p>No se pudo cargar el expediente público.</p>';}}
load();
</script>
</body></html>
