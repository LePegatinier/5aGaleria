name: Importar circulo Anti Sticker
on:
  push:
    paths:
      - ".github/workflows/import-antisticker-circulo.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar círculo
        run: |
          curl -L --fail -o assets/antisticker-club.png 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7e122e5c-0a42-4255-9582-97141e1d5903/watermark:F/width:197?csig=AAAAAAAAAAAAAAAAAAAAAGxhjlQq8entEklqiSbCsKWjvxZgAdJT2i3Ucqh4my9d&exp=1789984813&osig=AAAAAAAAAAAAAAAAAAAAAICJB0aNOJW6i6v6oNt9ZketPjAUK-92MS_LNo96OlhH&signer=media-rpc&x-canva-quality=thumbnail'
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/antisticker-club.png
          git commit -m "fix: incorporar circulo Anti Sticker correcto" || exit 0
          git push
