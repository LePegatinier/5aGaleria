name: 5a Galeria · Importar Anti Sticker Sticker Club

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descargar imagen Anti Sticker Sticker Club
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --output assets/antisticker-club.png 'https://media.canva.com/v2/image-resize/format:PNG/height:171/quality:100/uri:ifs%3A%2F%2FM%2F97d4e83b-26d7-4de2-b4e4-2d11105a2bfd/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMAslyLq68mf3z0PRW_f3g-cP6mqmXQNhi_RmTw514Lx&exp=1789980545&osig=AAAAAAAAAAAAAAAAAAAAAKFFITotaj3nMBMRQutSfuz9-gHOBfqnC74vGv5xrVJd&signer=media-rpc&x-canva-quality=thumbnail'
      - name: Guardar imagen en el repositorio
        run: |
          set -euo pipefail
          git config user.name "5a Galeria Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/antisticker-club.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: incorporar Anti Sticker Sticker Club en portada"
          git push
