name: Importar Anti Sticker final
on:
  push:
    paths:
      - ".github/workflows/import-antisticker-final.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imagen final
        run: |
          curl -L --fail -o assets/antisticker-club.png 'https://media.canva.com/v2/image-resize/format:PNG/height:171/quality:100/uri:ifs%3A%2F%2FM%2Fd8b14dad-50f7-4dac-b38c-c739ed669499/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMVSXnaLxEQwMt7VCyXmVw_q6mSxRLzCN_ArC9EwbCmM&exp=1789985690&osig=AAAAAAAAAAAAAAAAAAAAACK_WGAbL6fIthqMmK_ZiskHacGKHo7f95vLKPQdlzPh&signer=media-rpc&x-canva-quality=thumbnail'
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/antisticker-club.png
          git commit -m "fix: actualizar imagen Anti Sticker en portada" || exit 0
          git push
