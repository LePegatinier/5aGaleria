name: Importar Anti Sticker alta calidad
on:
  push:
    paths:
      - ".github/workflows/import-antisticker-hq.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imagen HQ
        run: |
          curl -L --fail -o assets/antisticker-club.png 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa8341a3f-ea4b-44c6-86b8-bcaf06d9c60d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABbmcAC-KSZdkZXOeDJYjqe2q-T28gxkdCDLp4T_W-qa&exp=1789985289&osig=AAAAAAAAAAAAAAAAAAAAAGFLXh3s3ui7C1NVT5jxFz9k0maERYWSqhTs81yZTgbM&signer=media-rpc&x-canva-quality=thumbnail'
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/antisticker-club.png
          git commit -m "fix: subir Anti Sticker en alta calidad" || exit 0
          git push
