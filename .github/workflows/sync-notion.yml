name: 5a Galeria · Sincronizar archivo público

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: 5a-galeria-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_VERSION: '2026-03-11'
      DATA_SOURCE_ID: '081d103e-208a-45df-a3f7-489a2deaf3eb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Procesar nuevos avistamientos y sincronizar archivo público
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const token=process.env.NOTION_TOKEN,version=process.env.NOTION_VERSION,ds=process.env.DATA_SOURCE_ID;
          if(!token)throw new Error('NOTION_TOKEN no está disponible.');
          const api=async(url,options={})=>{const res=await fetch(url,{...options,headers:{Authorization:`Bearer ${token}`,'Notion-Version':version,'Content-Type':'application/json',...(options.headers||{})}});const text=await res.text();let body;try{body=JSON.parse(text)}catch{body={raw:text}}if(!res.ok)throw new Error(`Notion API ${res.status}: ${body.message||text}`);return body};
          const prop=(p,n)=>p?.[n],rich=p=>p?.rich_text?.map(x=>x.plain_text||'').join('')||'',title=p=>p?.title?.map(x=>x.plain_text||'').join('')||'',select=p=>p?.select?.name||'',number=p=>typeof p?.number==='number'&&Number.isFinite(p.number)?p.number:null,date=p=>p?.date?.start||'';
          const norm=v=>{const m=String(v||'').trim().match(/(?:^|[^0-9A-Za-z])5a-(\d{1,6})(?:$|[^0-9A-Za-z])/i);return m?`5a-${m[1].padStart(6,'0')}`:''};
          const validCoords=v=>{const m=String(v||'').trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(!m)return false;const a=Number(m[1]),b=Number(m[2]);return Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180};
          async function queryAll(filter=null){const out=[];let cursor;do{const body={page_size:100,...(filter?{filter}:{}) ,...(cursor?{start_cursor:cursor}:{})};const d=await api(`https://api.notion.com/v1/data_sources/${ds}/query`,{method:'POST',body:JSON.stringify(body)});out.push(...(d.results||[]).filter(x=>x.object==='page'));cursor=d.has_more?d.next_cursor:null}while(cursor);return out}
          async function geocode(location,city){const q=[location,city,'España'].filter(Boolean).join(', ');if(!q)return '';const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&q=${encodeURIComponent(q)}`,{headers:{'User-Agent':'5a-Galeria/1.0 (archivo público)'}});if(!r.ok)throw new Error(`Nominatim HTTP ${r.status}`);const d=await r.json();if(!d.length)return '';const lat=Number(d[0].lat),lon=Number(d[0].lon);return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180?`${lat.toFixed(6)}, ${lon.toFixed(6)}`:''}
          async function patchPage(id,properties){return api(`https://api.notion.com/v1/pages/${id}`,{method:'PATCH',body:JSON.stringify({properties})})}
          async function processIntake(){
            const pages=await queryAll();
            const used=new Set(pages.map(x=>norm(title(prop(x.properties,'Expediente')))).filter(Boolean));
            let max=0;for(const x of used){const n=Number(x.slice(3));if(n>max)max=n}
            for(const page of pages){const p=page.properties||{};if(title(prop(p,'Expediente')).trim())continue;
              const expediente=`5a-${String(++max).padStart(6,'0')}`;
              const location=rich(prop(p,'Ubicación')).trim(),city=rich(prop(p,'Ciudad')).trim();
              let coords=rich(prop(p,'Coordenadas')).trim();
              if(!validCoords(coords)){try{coords=await geocode(location,city)}catch(e){console.warn(`Geocodificación fallida para ${expediente}: ${e.message}`);coords=''}}
              const properties={'Expediente':{title:[{type:'text',text:{content:expediente}}]},'Estado del expediente':{select:{name:coords?'EN REVISIÓN':'RECIBIDO'}}};
              if(coords)properties['Coordenadas']={rich_text:[{type:'text',text:{content:coords}}]};
              await patchPage(page.id,properties);
              console.log(`${expediente} asignado · ${coords?'EN REVISIÓN · '+coords:'RECIBIDO · sin coordenadas'}`);
              await new Promise(r=>setTimeout(r,1100));
            }
          }
          async function publicPages(){return queryAll({and:[{property:'Estado del expediente',select:{equals:'PÚBLICO'}},{property:'Publicado',checkbox:{equals:true}}]})}
          function category(i){if(!Number.isFinite(i)||i<0||i>20)return '';if(i<=3)return 'A — STREET RAW CERTIFIED';if(i<=7)return 'B — SEMI-WILD URBAN';if(i<=11)return 'C — URBAN DISTRICT APPROVED';if(i<=15)return 'D — ARTWASH READY™';return 'E — CONTENT SLURRY INDUSTRIAL'}
          function strata(p){const ns=['Origen','Mediación','Soporte','Autonomía','Artwash'],v=ns.map(n=>number(prop(p,`SS — ${n}`)));if(v.some(x=>x===null||x<0||x>4))return null;const c=[4-v[0],v[1],4-v[2],4-v[3],v[4]];return{values:v,contributions:c,index:c.reduce((a,b)=>a+b,0)}}
          async function syncStrata(page,p){const s=strata(p),e=rich(prop(p,'SS — Evidencia'));if(!s)return{index:null,category:'',values:[null,null,null,null,null],contributions:[null,null,null,null,null],evidence:e};const c=category(s.index),patch={'SS — Índice':{number:s.index},'StrataScore™':{select:{name:c}},'SS — Fecha revisión':{date:{start:new Date().toISOString().slice(0,10)}}};await patchPage(page.id,patch);return{index:s.index,category:c,values:s.values,contributions:s.contributions,evidence:e}}
          async function image(record,img){const src=img?.type==='file'?img.file?.url:img?.external?.url;if(!src)return '';const ext=(img?.name?.match(/\.(jpe?g|png|webp|gif)$/i)?.[1]||'jpg').toLowerCase(),dir=path.join('assets','archive');fs.mkdirSync(dir,{recursive:true});const file=`${record.expediente.replace(/[^a-zA-Z0-9_-]/g,'_')}.${ext}`,target=path.join(dir,file);try{const r=await fetch(src);if(!r.ok)throw new Error(`HTTP ${r.status}`);fs.writeFileSync(target,Buffer.from(await r.arrayBuffer()));return `assets/archive/${file}`}catch(e){console.warn(`No se pudo copiar ${record.expediente}: ${e.message}`);return ''}}
          (async()=>{
            await processIntake();
            const pages=await publicPages();
            fs.rmSync(path.join('assets','archive'),{recursive:true,force:true});fs.mkdirSync(path.join('assets','archive'),{recursive:true});
            const records=[],seen=new Set();
            for(const page of pages){const p=page.properties||{},raw=title(prop(p,'Expediente')).trim(),expediente=norm(raw);if(!expediente){console.warn(`Omitido ${page.id}: Expediente inválido.`);continue}if(seen.has(expediente)){console.warn(`Omitido duplicado: ${expediente}`);continue}
              let coords=rich(prop(p,'Coordenadas')).trim();if(!validCoords(coords)){try{coords=await geocode(rich(prop(p,'Ubicación')),rich(prop(p,'Ciudad')))}catch(e){coords=''}}if(!validCoords(coords)){console.warn(`No publicado ${expediente}: sin coordenadas válidas.`);continue}
              const s=await syncStrata(page,p),r={expediente,titulo:raw||'INTERVENCIÓN URBANA',artista:rich(prop(p,'Artista / Alias'))||'ANÓNIMO',ciudad:rich(prop(p,'Ciudad')),ubicacion:rich(prop(p,'Ubicación')),coordenadas:coords,fecha:date(prop(p,'Fecha')),tecnica:select(prop(p,'Técnica'))||'Desconocida',estado:select(prop(p,'Estado de la obra'))||'Desconocido',stratascore:s.category||'',strata_index:s.index,strata_origen:s.values[0],strata_mediacion:s.values[1],strata_soporte:s.values[2],strata_autonomia:s.values[3],strata_artwash:s.values[4],strata_contribucion:s.contributions,strata_evidence:s.evidence,observaciones:rich(prop(p,'Observaciones')),publicado:true,url:`expediente.html?id=${encodeURIComponent(expediente)}`,imagen:''};
              const files=prop(p,'Fotografía')?.files||[];if(files.length)r.imagen=await image(r,files[0]);seen.add(expediente);records.push(r)
            }
            records.sort((a,b)=>a.expediente.localeCompare(b.expediente,'es',{numeric:true}));
            fs.writeFileSync('data/archivo.json',JSON.stringify({version:'1.2',source:'5a GALERIA / ARCHIVO MAESTRO',updated:new Date().toISOString(),stratascore:{system:'StrataScore™ — Bareback Street Art Certification',scale:'A-E',index:'0-20',formula:'(4-Origen)+Mediación+(4-Soporte)+(4-Autonomía)+Artwash',direction:'0 = street raw / 20 = domesticated',not_quality:true,requires_complete_matrix:true},records},null,2)+'\n');
            console.log(`5a Galeria: ${records.length} expediente(s) público(s) sincronizado(s).`)
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE

      - name: Commit public archive if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "5a Galeria Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivo.json assets/archive
          if git diff --cached --quiet; then echo "Sin cambios en el archivo público."; exit 0; fi
          git commit -m "chore: sincronizar archivo público 5a Galeria"
          git push
